function submitSpell(){
  const q = currentQuestion();
  if (!q || q.answered || q.type !== 'spell') return;
  const input = $('#spell-input');
  const given = input ? input.value : '';
  if (!given.trim()){ toast('先写下答案'); if (input) input.focus(); return; }
  const norm = normalizeAnswer(given);
  const ans = normalizeAnswer(q.answer);
  q.correct = norm === ans || norm.replace(/\s+/g, '') === ans.replace(/\s+/g, '');
  q.given = given.trim();
  q.answered = true;
  testState.answers.push({ id: q.id, type: q.type, answer: q.answer, given: q.given, correct: q.correct });
  renderTest();
}

function translationScore(given, answer){
  const norm = function(s){
    return String(s || '').toLowerCase().replace(/[^a-z0-9' ]/g, ' ').replace(/\s+/g, ' ').trim();
  };
  const a = norm(answer), g = norm(given);
  if (!g) return 0;
  if (g === a) return 1;
  const STOP = { the:1, a:1, an:1, and:1, or:1, of:1, to:1, in:1, on:1, at:1, for:1, with:1, by:1, from:1, as:1, is:1, are:1, was:1, were:1, be:1, been:1, being:1, it:1, its:1, this:1, that:1, these:1, those:1, we:1, our:1, us:1, they:1, their:1, them:1, i:1, my:1, me:1, you:1, your:1, he:1, she:1, his:1, her:1, has:1, have:1, had:1, do:1, does:1, did:1, can:1, could:1, may:1, might:1, will:1, would:1, shall:1, should:1, not:1, no:1, but:1, so:1, if:1, than:1, then:1, there:1, here:1, which:1, who:1, what:1, when:1, where:1, how:1, more:1, most:1, some:1, any:1, all:1, one:1 };
  const aw = a.split(' ');
  const gw = {};
  g.split(' ').forEach(function(w){ gw[w] = (gw[w] || 0) + 1; });
  const content = aw.filter(function(w){ return !STOP[w]; });
  if (!content.length) return 0;
  let hit = 0;
  content.forEach(function(w){
    if (gw[w]) { hit++; gw[w]--; }
  });
  const givenCount = g.split(' ').length;
  const lengthOK = givenCount >= Math.max(3, Math.floor(aw.length * 0.5));
  if (!lengthOK) return Math.min(0.5, hit / content.length);
  return hit / content.length;
}

function submitTranslation(){
  const q = currentQuestion();
  if (!q || q.answered || q.type !== 'translate') return;
  const ta = $('#essay-answer');
  const given = ta ? ta.value : '';
  if (!given.trim()){ toast('先写下英文'); if (ta) ta.focus(); return; }
  q.sim = translationScore(given, q.answer);
  q.correct = q.sim >= 0.75;
  q.given = given.trim();
  q.answered = true;
  testState.answers.push({
    id: q.essayId,
    essayId: q.essayId,
    type: 'translate',
    answer: q.answer,
    given: q.given,
    correct: q.correct,
    sim: q.sim
  });
  renderTest();
}

function pickOption(i){
  const q = currentQuestion();
  if (!q || q.answered || (q.type !== 'choice' && q.type !== 'context')) return;
  const opt = q.options[i];
  q.correct = opt === q.answer;
  q.given = opt;
  q.answered = true;
  testState.answers.push({ id: q.id, type: q.type, answer: q.answer, given: opt, correct: q.correct });
  renderTest();
}

function nextQuestion(){
  if (!testState || testState.phase !== 'question') return;
  testState.idx++;
  if (testState.idx >= testState.questions.length){
    computeTestResult();
  } else {
    renderTest();
  }
}

function computeTestResult(){
  if (!testState || testState.phase === 'result') return;
  stopTestTimer();
  const qs = testState.questions;
  const answers = testState.answers;
  const total = qs.length;
  const correct = answers.filter(function(a){ return a.correct; }).length;
  const rate = total ? Math.round(correct / total * 100) : 0;
  const passed = rate >= settings().testPass;
  const missed = [];
  const missedEssays = [];
  const resettedWords = {};
  const resettedEssays = {};
  answers.forEach(function(a){
    if (a.correct) return;
    if (a.type === 'translate'){
      const e = essayById(a.essayId);
      if (e && !resettedEssays[e.id]){
        resettedEssays[e.id] = true;
        missedEssays.push({ id: e.id, en: e.en, zh: e.zh, category: e.category });
        e.stage = 0;
        e.lapses = (e.lapses || 0) + 1;
        e.nextReview = todayKey();
        e.lastReview = todayKey();
        e.masteredAt = null;
        if (!Array.isArray(e.history)) e.history = [];
        e.history.push({ d: todayKey(), r: 0 });
      }
    } else {
      const w = wordById(a.id);
      if (w && !resettedWords[w.id]){
        resettedWords[w.id] = true;
        missed.push({ id: w.id, term: w.term, meaning: (a.target ? a.target + '：' : '') + w.meaning });
        w.stage = 0;
        w.lapses = (w.lapses || 0) + 1;
        w.nextReview = todayKey();
        w.lastReview = todayKey();
        w.masteredAt = null;
        if (!Array.isArray(w.history)) w.history = [];
        w.history.push({ d: todayKey(), r: 0 });
      }
    }
  });
  const essayAnswers = answers.filter(function(a){ return a.type === 'translate'; });
  const essayCorrect = essayAnswers.filter(function(a){ return a.correct; }).length;
  const rec = {
    id: uid('t'),
    date: todayKey(),
    total: total,
    correct: correct,
    passed: passed,
    score: rate,
    forced: !!testState.forced,
    wordTotal: answers.length - essayAnswers.length,
    wordCorrect: correct - essayCorrect,
    essayTotal: essayAnswers.length,
    essayCorrect: essayCorrect,
    missed: missed,
    missedEssays: missedEssays
  };
  state.tests.unshift(rec);
  state.meta.lastTestDate = todayKey();
  state.meta.retestDate = passed ? null : addDaysKey(todayKey(), 1);
  state.meta.snoozeUntil = 0;
  state.meta.snoozeUsedDate = null;
  state.meta.notifiedDate = todayKey();
  testState.phase = 'result';
  testState.result = rec;
  saveState();
  renderTest();
  render();
}

function testResultHTML(){
  const r = testState.result;
  if (!r) return '';
  const rate = r.score;
  const color = r.passed ? '#3f6b52' : '#b13a2a';
  const nextInfo = r.passed
    ? '下次测试：' + fmtCN(addDaysKey(todayKey(), settings().testEveryDays), true) + '。'
    : '明天会强制补测，直到通过为止。';
  const part = [];
  if (r.wordTotal) part.push('单词 ' + r.wordCorrect + '/' + r.wordTotal);
  if (r.essayTotal) part.push('作文 ' + r.essayCorrect + '/' + r.essayTotal);
  return '' +
    '<div class="test-overlay"><div class="test-body"><div class="test-panel"><div class="result">' +
      '<div class="result-ring" style="--p:' + rate + ';--rc:' + color + '"><div class="in">' +
        '<b>' + rate + '<small>%</small></b><span>总答对率</span>' +
      '</div></div>' +
      '<h2>' + (r.passed ? '通过。' : '这次没过。') + '</h2>' +
      '<p class="verdict">答对 <b>' + r.correct + ' / ' + r.total + '</b> 题，通过线 ' + settings().testPass + '%。<br>' +
        (part.length ? part.join(' · ') + '<br>' : '') + nextInfo + '</p>' +
      (r.missed.length ?
        '<div class="missed"><h4>需要重新记的场景 · ' + r.missed.length + '</h4>' +
          r.missed.slice(0, 8).map(function(m){
            return '<div class="missed-row"><b>' + esc(m.term) + '</b><span>' + esc(m.meaning) + '</span></div>';
          }).join('') +
          (r.missed.length > 8 ? '<p class="note" style="margin-top:8px">还有 ' + (r.missed.length - 8) + ' 个…</p>' : '') +
        '</div>' : '') +
      (r.missedEssays && r.missedEssays.length ?
        '<div class="missed"><h4>需要重新背的句子 · ' + r.missedEssays.length + '</h4>' +
          r.missedEssays.slice(0, 5).map(function(m){
            return '<div class="missed-row essay-missed"><b>' + esc(m.zh || m.en) + '</b><span>' + esc(m.en) + '</span></div>';
          }).join('') +
          (r.missedEssays.length > 5 ? '<p class="note" style="margin-top:8px">还有 ' + (r.missedEssays.length - 5) + ' 句…</p>' : '') +
        '</div>' : '') +
      '<div class="result-actions">' +
        '<button class="btn primary lg" data-act="finish-test">完成' + (r.passed ? '' : '，明天再测') + '</button>' +
        '<button class="btn ghost" data-act="finish-test-library">' +
          ((r.missedEssays && r.missedEssays.length && !r.missed.length) ? '去作文看错句' : '去复习错题') +
        '</button>' +
      '</div>' +
      '<p class="note" style="margin-top:16px">' + (testState.forced ? '强制测试已完成，页面恢复自由。' : '测试记录已保存。') + '</p>' +
    '</div></div></div></div>';
}

function finishTest(goLibrary){
  stopTestTimer();
  const failed = testState && testState.result && !testState.result.passed;
  const missedEssays = testState && testState.result && testState.result.missedEssays ? testState.result.missedEssays.length : 0;
  const missedWords = testState && testState.result && testState.result.missed ? testState.result.missed.length : 0;
  testState = null;
  const root = $('#test-root');
  if (root) root.innerHTML = '';
  if (goLibrary){
    if (missedEssays && !missedWords){
      ui.view = 'essay';
      ui.essayTab = 'library';
      ui.essayFilter = 'learning';
      ui.essaySearch = '';
    } else {
      ui.view = 'library';
      ui.filter = 'lapsed';
      ui.search = '';
    }
  } else if (failed){
    ui.view = 'today';
  }
  render();
  saveState();
  if (failed) toast('没通过的词和句子已退回复习队列，明天补测', 'bad', 4000);
  else toast('测试完成，记录已保存', 'ok');
  maybeForceTest(1200);
}

function snoozeTest(){
  if (!testState || testState.phase !== 'intro' || !testState.forced) return;
  if (!settings().allowSnooze || state.meta.snoozeUsedDate === todayKey()){
    toast('今天的推迟机会已经用过了');
    return;
  }
  state.meta.snoozeUsedDate = todayKey();
  state.meta.snoozeUntil = Date.now() + 10 * 60 * 1000;
  saveState();
  testState = null;
  const root = $('#test-root');
  if (root) root.innerHTML = '';
  render();
  toast('好，10 分钟后再来找你', 'ok', 3500);
}

function abortTest(){
  if (!testState || testState.forced) return;
  testState = null;
  stopTestTimer();
  const root = $('#test-root');
  if (root) root.innerHTML = '';
  render();
}

function maybeForceTest(){
  if (testState || sessionState || essaySessionState) return;
  if (!settings().autoTest || !settings().strictTest) return;
  const modal = $('#modal-root');
  if (modal && modal.classList.contains('open')) return;
  const info = testInfo();
  if (info.force){
    openTest(true);
  }
}

function parseSceneWordsText(text){
  return String(text || '').split(/\n+/).map(function(line){
    line = line.trim();
    if (!line) return null;
    const m = line.match(/^(.+?)\s*(?:\||—|–|:：)\s*(.+)$/);
    if (m) return { term: m[1].trim(), meaning: m[2].trim() };
    const p = line.split(/\s+/);
    return { term: p.shift(), meaning: p.join(' ').trim() };
  }).filter(function(x){ return x && x.term; });
}

function saveWord(id){

  if (!words.length){ toast('至少写一个目标词', 'bad'); return; }
  w.term = term.trim();
  w.sceneWords = words.slice(0, 8);
  w.meaning = words.map(function(x){ return x.term + ' ' + x.meaning; }).join('；');
  w.example = (($('#mw-example') || {}).value || '').trim();
  w.exampleZh = (($('#mw-exampleZh') || {}).value || '').trim();

async function confirmImport(){

  if (!chosen.length){ toast('至少勾选一个场景', 'bad'); return; }
  const dateEl = $('#imp-date');
  const tagEl = $('#imp-tag');
  const date = dateEl && dateEl.value ? dateEl.value : todayKey();
  const batchTag = tagEl ? tagEl.value.trim() : ui.importTag;
  ui.importTag = batchTag;

  if (state.meta.demo && state.words.length){
    const clearDemo = await confirmDialog({
      title: '当前是示例场景',

      state = blankState();
      state.settings = keep;

      state.meta.demo = false;
    }
  }

  const existing = {};
  state.words.forEach(function(w){ existing[sceneKeyText(w.example || w.term)] = true; });
  let added = 0, skipped = 0, wordCount = 0;
  chosen.forEach(function(r){
    const key = sceneKeyText(r.sentence || r.title);
    if (!r.sentence || !r.words.length || existing[key]){ skipped++; return; }
    existing[key] = true;
    state.words.push({
      id: uid('s'),
      term: r.title,
      meaning: r.words.map(function(x){ return x.term + ' ' + x.meaning; }).join('；'),
      example: r.sentence,
      exampleZh: r.translation,
      sceneWords: r.words,
      phonetic: '',

      source: draft.source || 'AI / 手动 JSON',

      stage: 0,
      nextReview: null,
      lastReview: null,
      seen: 0,
      correct: 0,
      lapses: 0,
      masteredAt: null,
      history: []
    });

    wordCount += r.words.length;

  ui.importDraft = null;
  ui.importText = '';
  ui.importSource = '';
  ui.importTag = '';

async function handleImportFile(file){
  if (!file) return;
  try{
    const text = await readTextFile(file);
    ui.importText = text;
    ui.importSource = file.name;
    ui.importMessage = null;

    const trimmed = String(text || '').trim();
    if (/^[\[{]/.test(trimmed)){
      try{
        const data = JSON.parse(trimmed);
        const looksBackup = data && Array.isArray(data.words) &&
          data.words.some(function(w){ return w && w.id && w.createdAt; });
        if (looksBackup){
          const yes = await confirmDialog({
            title: '这是完整备份',
            message: '「' + file.name + '」里有学习进度和测试记录。恢复会覆盖当前数据；选择「只导入场景」则把其中的场景当成新卡导入。',
            ok: '恢复备份',
            cancel: '只导入场景'
          });
          if (yes){ applyRestoreData(data); return; }
        }
      }catch(e){}
    }

    const rows = parseSceneText(text);
    if (!rows.length){
      ui.importDraft = null;
      render();
      toast('这个文件里没有解析到场景，确认是合法 JSON', 'bad', 4000);
      return;
    }
    ui.importDraft = { rows: rows, source: file.name };
    render();
    toast('已读取「' + file.name + '」：' + rows.length + ' 个场景', 'ok');
    setTimeout(function(){
      const el = $('.import-preview');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 80);
  }catch(err){
    toast('文件读取失败：' + err.message, 'bad');
  }
}

    const trimmed = String(text || '').trim();
    if (/^[\[{]/.test(trimmed)){
      try{
        const data = JSON.parse(trimmed);
        if (data && Array.isArray(data.words) && data.words.some(function(w){ return w && w.id && w.createdAt; })){
          const yes = await confirmDialog({
            title: '这是完整备份',
            message: '「' + file.name + '」包含学习进度和测试记录。恢复会覆盖当前数据；选择「只导入句子」则只把作文句当素材导入。',
            ok: '恢复备份',
            cancel: '只导入句子'
          });
          if (yes){ applyRestoreData(data); return; }
        }
      }catch(e){}
    }
    const rows = parseEssayText(text);
    if (!rows.length){
      ui.essayDraft = null;
      render();
      toast('这个文件里没有解析到作文句', 'bad', 3600);
      return;
    }
    ui.essayDraft = { rows: rows, source: file.name };
    render();
    toast('已读取「' + file.name + '」：' + rows.length + ' 句', 'ok');
    setTimeout(function(){
      const el = $('.import-preview');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 80);
  }catch(err){
    toast('文件读取失败：' + err.message, 'bad');
  }
}

async function confirmEssayImport(){
  const d = ui.essayDraft;
  if (!d) return;
  const chosen = d.rows.filter(function(r){ return r.include; });
  if (!chosen.length){ toast('至少勾选一个句子', 'bad'); return; }
  const dateEl = $('#essay-date'), tagEl = $('#essay-tag'), catEl = $('#essay-cat');
  const date = dateEl && dateEl.value ? dateEl.value : todayKey();
  const tag = tagEl ? tagEl.value.trim() : ui.essayImportTag;
  const cat = catEl ? catEl.value : 'auto';
  ui.essayImportTag = tag;
  ui.essayImportDate = date;

  if (state.meta.demo && (state.words.length + state.essays.length)){
    const clearDemo = await confirmDialog({
      title: '当前是示例数据',
      message: '导入前建议先清空示例，形成你自己的词库和作文素材。「清空并导入」会删除示例词和示例句子；「保留示例」会混在一起。',
      ok: '清空并导入',
      cancel: '保留示例一起导入'
    });
    if (clearDemo){
      const keep = state.settings;
      state = blankState();
      state.settings = keep;
    } else {
      state.meta.demo = false;
    }
  }

  const existing = {};
  state.essays.forEach(function(e){ existing[essayKey(e.en)] = true; });
  let added = 0, skipped = 0;
  chosen.forEach(function(r){
    const key = essayKey(r.en);
    if (!r.en || existing[key]){ skipped++; return; }
    existing[key] = true;
    state.essays.push({
      id: uid('e'),
      en: r.en,
      zh: r.zh || '',
      category: cat !== 'auto' ? cat : r.category,
      tag: tag,
      source: d.source || '手动粘贴',
      note: '',
      createdAt: date,
      stage: 0,
      nextReview: null,
      lastReview: null,
      seen: 0,
      correct: 0,
      lapses: 0,
      masteredAt: null,
      history: []
    });
    added++;
  });
  saveState();
  ui.essayDraft = null;
  ui.essayImportText = '';
  ui.essayImportSource = '';
  ui.essayImportTag = '';
  ui.essayImportDate = todayKey();
  ui.essayImportMessage = { count: added, dups: skipped, date: date };
  render();
  toast('已导入 ' + added + ' 个作文句', 'ok');
}

function toggleEssayImp(i){

  d.rows[i].include = !d.rows[i].include;

}

async function deleteEssay(id, fromModal){

async function resetEssayProgress(id){

function handleAction(act, el){
  switch (act){
    case 'start-session': startSession(); break;
    case 'practice-bad':
      if (sessionState && sessionState.badIds.length) startSession(sessionState.badIds.slice());
      break;
    case 'start-essay-session': startEssaySession(); break;
    case 'practice-bad-essay':
      if (essaySessionState && essaySessionState.badIds.length) startEssaySession(essaySessionState.badIds.slice());
      break;
    case 'essay-reveal': essaySessionReveal(); break;
    case 'essay-grade': essaySessionGrade(el.dataset.g); break;
    case 'close-essay-session': closeEssaySession(); break;
    case 'speak-current': speakCurrentEssay(); break;
    case 'speak-essay': speakEssayById(el.dataset.id); break;
    case 'speak-scene': { const sw = wordById(el.dataset.id); if (sw) speakText(sw.example || ''); break; }
    case 'speak-scene-current': speakCurrentScene(); break;
    case 'essay-tab': ui.essayTab = el.dataset.tab; render(); break;
    case 'essay-import-tab': ui.view = 'essay'; ui.essayTab = 'import'; render(); break;
    case 'essay-library-tab': ui.view = 'essay'; ui.essayTab = 'library'; render(); break;
    case 'essay-filter': ui.essayFilter = el.dataset.filter; ui.essayLimit = 60; render(); break;
    case 'essay-load-more': ui.essayLimit += 60; render(); break;
    case 'essay-clear-filters': ui.essaySearch = ''; ui.essayFilter = 'all'; render(); break;
    case 'parse-essay': doParseEssay(); break;
    case 'fill-essay-sample': fillEssaySample(); break;
    case 'clear-essay-import':
      ui.essayImportText = ''; ui.essayDraft = null; ui.essayImportMessage = null; ui.essayImportSource = '';
      render();
      break;
    case 'dismiss-essay-msg': ui.essayImportMessage = null; render(); break;
    case 'toggle-essay-imp': toggleEssayImp(Number(el.dataset.i)); break;
    case 'toggle-essay-all':
      if (ui.essayDraft) ui.essayDraft.rows.forEach(function(r){ r.include = true; });
      render();
      break;
    case 'toggle-essay-none':
      if (ui.essayDraft) ui.essayDraft.rows.forEach(function(r){ r.include = false; });
      render();
      break;
    case 'confirm-essay-import': confirmEssayImport(); break;
    case 'edit-essay': openEssayModal(el.dataset.id); break;
    case 'save-essay': saveEssay(el.dataset.id); break;
    case 'delete-essay': deleteEssay(el.dataset.id, false); break;
    case 'delete-essay-modal': deleteEssay(el.dataset.id, true); break;
    case 'reset-essay': resetEssayProgress(el.dataset.id); break;
    case 'submit-translation': submitTranslation(); break;
    case 'export-essay-csv': exportEssayCSV(); break;
    case 'test-speak': speakText('Only by taking effective measures can we build a harmonious society.'); break;
    case 'close-session': closeSession(); break;
    case 'reveal': sessionReveal(); break;
    case 'grade': sessionGrade(el.dataset.g); break;
    case 'manual-test': openTest(testInfo().force); break;
    case 'preview-test': openTest(true, true); break;
    case 'begin-test': beginTest(); break;
    case 'snooze-test': snoozeTest(); break;
    case 'abort-test': abortTest(); break;
    case 'pick-option': pickOption(Number(el.dataset.i)); break;
    case 'submit-spell': submitSpell(); break;
    case 'next-question': nextQuestion(); break;
    case 'finish-test': finishTest(false); break;
    case 'finish-test-library': finishTest(true); break;
    case 'clear-demo': clearDemo(); break;
    case 'load-demo': loadDemo(); break;
    case 'filter': ui.filter = el.dataset.filter; ui.selected = {}; ui.libLimit = 80; render(); break;
    case 'load-more': ui.libLimit += 80; render(); break;
    case 'clear-filters': ui.search = ''; ui.filter = 'all'; render(); break;
    case 'toggle-word':
      if (ui.selected[el.dataset.id]) delete ui.selected[el.dataset.id];
      else ui.selected[el.dataset.id] = true;
      render();
      break;
    case 'select-all':
    case 'select-all-on': {
      const list = filteredWords();
      const allOn = list.every(function(w){ return ui.selected[w.id]; });
      list.forEach(function(w){
        if (act === 'select-all-on' || !allOn) ui.selected[w.id] = true;
        else delete ui.selected[w.id];
      });
      render();
      break;
    }
    case 'clear-selection': ui.selected = {}; render(); break;
    case 'delete-word': deleteWord(el.dataset.id, false); break;
    case 'delete-selected': deleteSelected(); break;
    case 'edit-word': openWordModal(el.dataset.id); break;
    case 'save-word': saveWord(el.dataset.id); break;
    case 'reset-word': resetWordProgress(el.dataset.id); break;
    case 'delete-word-modal': deleteWord(el.dataset.id, true); break;
    case 'parse-import': doParseImport(); break;
    case 'copy-scene-prompt': copyText(AI_PROMPT + '\n'); break;
    case 'fill-sample': fillSample(); break;
    case 'clear-import':
      ui.importText = ''; ui.importDraft = null; ui.importMessage = null; ui.importSource = '';
      render();
      break;
    case 'dismiss-import-msg': ui.importMessage = null; render(); break;
    case 'toggle-imp': toggleImportRow(Number(el.dataset.i)); break;
    case 'toggle-imp-all':
      if (ui.importDraft) ui.importDraft.rows.forEach(function(r){ r.include = true; });
      render();
      break;
    case 'toggle-imp-none':
      if (ui.importDraft) ui.importDraft.rows.forEach(function(r){ r.include = false; });
      render();
      break;
    case 'confirm-import': confirmImport(); break;
    case 'reset-intervals':
      state.settings.intervals = DEFAULT_INTERVALS.slice();
      reconcileSchedules();
      saveState(); render(); toast('已恢复默认曲线', 'ok');
      break;
    case 'export-json': exportJSON(); break;
    case 'export-csv': exportCSV(); break;
    case 'restore-json':
      { const f = $('#restore-file'); if (f) f.click(); }
      break;
    case 'reset-all': resetAll(); break;
    case 'test-notify': sendTestNotification(); break;
    case 'close-modal': closeModal(false); break;
    case 'modal-ok': closeModal(true); break;
    case 'modal-cancel': closeModal(false); break;
    case 'copy-eng-sync':
      copyText(getEngSyncId());
      break;
    case 'pull-eng-sync':
      pullEngFromCloud();
      break;
    case 'push-eng-sync':
      pushEngToCloud(false);
      break;
    default: break;
  }
}

/* ------------------------------------------------------------
   17. 事件绑定
   ------------------------------------------------------------ */
let composing = false;

function bindEvents(){
  document.addEventListener('click', function(e){
    if (e.target.dataset && e.target.dataset.backdrop === '1'){ closeModal(false); return; }
    const viewEl = e.target.closest('[data-view]');
    if (viewEl){ setView(viewEl.dataset.view); return; }
    const el = e.target.closest('[data-act]');
    if (!el) return;
    if (el.tagName === 'INPUT' && el.type === 'checkbox'){
      /* checkboxes are handled by click actions */
    }
    handleAction(el.dataset.act, el);
  });

  document.addEventListener('change', async function(e){
    const t = e.target;
    if (t.id === 'imp-file'){
      const f = t.files && t.files[0];
      t.value = '';
      if (f) await handleImportFile(f);
      return;
    }
    if (t.id === 'essay-file'){
      const f = t.files && t.files[0];
      t.value = '';
      if (f) await handleEssayFile(f);
      return;
    }
    if (t.id === 'restore-file'){
      const f = t.files && t.files[0];
      t.value = '';
      if (f) await handleRestoreFile(f);
      return;
    }
    if (t.dataset && t.dataset.set){
      const key = t.dataset.set;
      if (key === 'notify'){
        if (t.checked){
          const ok = await requestNotifyPermission();
          if (!ok){
            t.checked = false;
            toast('没有获得通知权限；页面内提醒仍然有效', 'bad', 3400);
            return;
          }
        }
        state.settings.notify = !!t.checked;
      } else if (t.type === 'number'){
        const v = clamp(Number(t.value) || 1, Number(t.min) || 1, Number(t.max) || 999);
        state.settings[key] = v;
        t.value = v;
      } else {
        state.settings[key] = t.value;
      }
      saveState();
      render();
      toast('设置已保存', 'ok', 1200);
      return;
    }
    if (t.dataset && t.dataset.int != null){
      const i = Number(t.dataset.int);
      const v = clamp(Number(t.value) || 1, 1, 365);
      state.settings.intervals[i] = v;
      t.value = v;
      reconcileSchedules();
      saveState();
      render();
      return;
    }
    if (t.dataset && t.dataset.sort){
      ui.sort = t.value;
      render();
      return;
    }
    if (t.id === 'imp-date'){ ui.importDate = t.value; }
    if (t.id === 'imp-tag'){ ui.importTag = t.value; }
    if (t.id === 'essay-date'){ ui.essayImportDate = t.value; }
    if (t.id === 'essay-tag'){ ui.essayImportTag = t.value; }
  });

  document.addEventListener('input', debounce(function(e){
    const t = e.target;
    if (t.id === 'lib-search'){
      ui.search = t.value;
      ui.libLimit = 80;
      render();
    } else if (t.id === 'imp-text'){
      ui.importText = t.value;
    } else if (t.id === 'imp-tag'){
      ui.importTag = t.value;
    } else if (t.id === 'essay-search'){
      ui.essaySearch = t.value;
      ui.essayLimit = 60;
      render();
    } else if (t.id === 'essay-text'){
      ui.essayImportText = t.value;
    } else if (t.id === 'essay-tag'){
      ui.essayImportTag = t.value;
    }
  }, 150));
  document.addEventListener('compositionstart', function(){ composing = true; });
  document.addEventListener('compositionend', function(){
    composing = false;
    const t = document.activeElement;
    if (t && t.id === 'lib-search'){ ui.search = t.value; render(); }
    if (t && t.id === 'essay-search'){ ui.essaySearch = t.value; render(); }
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){
      const modal = $('#modal-root');
      if (modal && modal.classList.contains('open')){ closeModal(false); return; }
      if (essaySessionState && !essaySessionState.finished){ closeEssaySession(); return; }
      if (sessionState && !sessionState.finished){ closeSession(); return; }
    }
    if (testState){
      if (testState.phase === 'question'){
        const q = currentQuestion();
        if (!q) return;
        if (!q.answered && q.type === 'choice'){
          const map = { '1': 0, '2': 1, '3': 2, '4': 3, a: 0, b: 1, c: 2, d: 3, A: 0, B: 1, C: 2, D: 3 };
          const key = e.key;
          if (map[key] != null && q.options[map[key]] != null){
            e.preventDefault(); pickOption(map[key]); return;
          }
        }
        if (!q.answered && q.type === 'spell' && e.key === 'Enter'){
          e.preventDefault(); submitSpell(); return;
        }
        if (!q.answered && q.type === 'translate' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)){
          e.preventDefault(); submitTranslation(); return;
        }
        if (q.answered && e.key === 'Enter'){
          e.preventDefault(); nextQuestion(); return;
        }
      }
      if (testState.phase === 'result' && e.key === 'Enter'){ e.preventDefault(); finishTest(false); }
      return;
    }
    if (essaySessionState && !essaySessionState.finished){
      if (e.key === ' ' || e.key === 'Enter'){
        e.preventDefault();
        if (!essaySessionState.revealed) essaySessionReveal();
        return;
      }
      if (essaySessionState.revealed && (e.key === '1' || e.key === '2' || e.key === '3')){
        e.preventDefault();
        essaySessionGrade(e.key === '1' ? 'bad' : (e.key === '2' ? 'hard' : 'good'));
        return;
      }
    }
    if (essaySessionState && essaySessionState.finished && e.key === 'Enter'){
      doCloseEssaySession();
      return;
    }
    if (sessionState && !sessionState.finished){
      if (e.key === ' ' || e.key === 'Enter'){
        e.preventDefault();
        if (!sessionState.revealed) sessionReveal();
        return;
      }
      if (sessionState.revealed && (e.key === '1' || e.key === '2' || e.key === '3')){
        e.preventDefault();
        sessionGrade(e.key === '1' ? 'bad' : (e.key === '2' ? 'hard' : 'good'));
        return;
      }
    }
    if (sessionState && sessionState.finished && e.key === 'Enter'){
      doCloseSession();
    }
  });

  document.addEventListener('dragover', function(e){
    if (e.target.closest && (e.target.closest('#imp-text') || e.target.closest('#essay-text'))) e.preventDefault();
  });
  document.addEventListener('drop', async function(e){
    const ta = e.target.closest && e.target.closest('#imp-text');
    const et = e.target.closest && e.target.closest('#essay-text');
    if (!ta && !et) return;
    e.preventDefault();
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    if (ta) await handleImportFile(f);
    else await handleEssayFile(f);
  });

  window.addEventListener('beforeunload', saveState);
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) tick();
  });
}

/* ------------------------------------------------------------
   18. 定时器：提醒 / 强制测试 / 跨天
   ------------------------------------------------------------ */
let lastDay = todayKey();
let reminderTimer = null;

function checkReminder(){
  if (testState) return;
  const t = todayKey();
  if (nowHM() < settings().remindTime) return;
  if (state.meta.notifiedDate === t) return;
  const task = todayTask();
  const et = essayTask();
  const ti = testInfo();
  if (task.remaining === 0 && et.remaining === 0 && !ti.due) return;
  state.meta.notifiedDate = t;
  saveState();
  const parts = [];
  if (task.remaining) parts.push(task.remaining + ' 张单词卡待复习');
  if (et.remaining) parts.push(et.remaining + ' 个作文句待背');
  if (ti.due) parts.push('一次周期测试待完成');
  const msg = '今天的任务还没完成：' + parts.join('，');
  if (settings().notify && 'Notification' in window && Notification.permission === 'granted'){
    try{ new Notification('砚词 · 到点了', { body: msg }); }catch(e){}
  }
  toast(msg, 'info', 5600);
}

function tick(){
  const t = todayKey();
  if (t !== lastDay){
    lastDay = t;
    render();
    toast('新的一天，今日任务已更新', 'ok', 3200);
  }
  if (!testState && !sessionState && !essaySessionState) maybeForceTest();
  checkReminder();
}

   19. 启动
   ------------------------------------------------------------ */
function boot(){
  const q = new URLSearchParams(location.search);
  if (q.get('fresh') === '1') localStorage.removeItem(STORE_KEY);
  if (q.get('blank') === '1'){
    state = blankState();
    saveState();
  } else if (q.get('fresh') === '1'){
    state = seedDemo();
    saveState();
  } else {
    state = loadState();
    saveState();
  }
  ui.importDate = todayKey();
  ui.importTag = '';
  const v = q.get('view');
  if (v && VIEW_TITLE[v]) ui.view = v;
  if (state.meta.demo && ui.view === 'today') ui.view = 'today';
  render();
  bindEvents();
  lastDay = todayKey();
  setInterval(tick, 20000);
  setTimeout(checkReminder, 800);

  const preview = q.get('preview');
  if (preview === 'test'){
    setTimeout(function(){ openTest(true, true); }, 250);
  } else if (preview === 'session'){
    setTimeout(function(){ startSession(); }, 250);
  } else if (preview === 'essay'){
    setTimeout(function(){ ui.view = 'essay'; render(); }, 250);
  } else if (preview === 'essay-session'){
    setTimeout(function(){ ui.view = 'essay'; render(); startEssaySession(); }, 250);
  } else {
    setTimeout(function(){ maybeForceTest(); }, 1600);
  }
}

window.addEventListener('error', function(ev){
  const el = document.getElementById('boot-error');
  if (el){
    el.style.display = 'block';
    el.textContent = '脚本错误：' + (ev.message || ev.error) + ' @ ' + (ev.filename || '') + ':' + (ev.lineno || '');
  }
});

if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
boot();
</script>
